server {
    listen 80;
    server_name cafe-proy;

    root /usr/share/nginx/html;
    index index.html;

    # La URL del API se regenera al arrancar el contenedor: no cachear.
    location = /env.js {
        add_header Cache-Control "no-store";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}