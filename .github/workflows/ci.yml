name: CI/CD Monorepo

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  NODE_VERSION: '20'

jobs:
  # ============================================================
  # BACKEND (Cafe-API)
  # ============================================================
  backend:
    name: Backend Tests & Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./Cafe-API

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: cafedb
        ports: ['5432:5432']
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: Cafe-API/package-lock.json

      - name: Install deps
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm run test

      - name: E2E tests
        run: npm run test:e2e
        env:
          DB_HOST: localhost
          DB_PORT: 5432
          DB_USER: postgres
          DB_PASSWORD: postgres
          DB_NAME: cafedb

      - name: Build
        run: npm run build

  # ============================================================
  # FRONTEND (cafe-frontend)
  # ============================================================
  frontend:
    name: Frontend Tests & Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./cafe-frontend

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: cafe-frontend/package-lock.json

      - name: Install deps
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Install Chromium for tests
        run: |
          sudo apt-get update
          sudo apt-get install -y chromium-browser

      - name: Tests
        run: |
          CHROME_PATH=$(which chromium-browser || which chromium || which google-chrome || true)
          if [ -z "$CHROME_PATH" ]; then
            echo "ERROR: Chrome/Chromium binary not found"
            exit 1
          fi
          echo "Using Chrome binary: $CHROME_PATH"
          npm test -- --watch=false --browsers=ChromeHeadless
        env:
          CHROME_BIN: /usr/bin/chromium-browser
          CI: true

      - name: Build
        run: npm run build

  # ============================================================
  # DOCKER: Build & Push (solo en push a main)
  # ============================================================
  docker:
    name: Docker Build & Push
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Backend image
      - name: Build & Push Backend
        uses: docker/build-push-action@v5
        with:
          context: ./Cafe-API
          file: ./Cafe-API/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/cafe-api:${{ github.sha }}
            ${{ secrets.DOCKERHUB_USERNAME }}/cafe-api:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Frontend image
      - name: Build & Push Frontend
        uses: docker/build-push-action@v5
        with:
          context: ./cafe-frontend
          file: ./cafe-frontend/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/cafe-frontend:${{ github.sha }}
            ${{ secrets.DOCKERHUB_USERNAME }}/cafe-frontend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Postgres image (tag de referencia)
      - name: Push Postgres reference
        run: |
          docker pull postgres:16
          docker tag postgres:16 ${{ secrets.DOCKERHUB_USERNAME }}/cafe-postgres:16
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/cafe-postgres:16