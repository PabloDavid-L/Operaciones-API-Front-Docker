apiVersion: v1
kind: Service
metadata:
  name: prometheus
  namespace: cafe
  labels:
    app: prometheus
    app.kubernetes.io/part-of: cafe
spec:
  selector:
    app: prometheus
  ports:
    # Puerto 9090 para que la datasource de Grafana funcione tal cual.
    - name: http
      port: 9090
      targetPort: 9090
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  namespace: cafe
  labels:
    app: prometheus
    app.kubernetes.io/part-of: cafe
spec:
  replicas: 1
  selector:
    matchLabels:
      app: prometheus
  template:
    metadata:
      labels:
        app: prometheus
    spec:
      containers:
        - name: prometheus
          image: prom/prometheus:latest
          imagePullPolicy: IfNotPresent
          args:
            - --config.file=/etc/prometheus/prometheus.yml
            - --storage.tsdb.path=/prometheus
            - --storage.tsdb.retention.time=7d
            - --web.enable-lifecycle
          ports:
            - name: http
              containerPort: 9090
          volumeMounts:
            - name: config
              mountPath: /etc/prometheus
              readOnly: true
            # Datos efímeros: alcanza para monitoreo local.
            - name: data
              mountPath: /prometheus
          readinessProbe:
            httpGet:
              path: /-/ready
              port: 9090
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /-/healthy
              port: 9090
            initialDelaySeconds: 20
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
      volumes:
        # Generado por kustomize desde k8s/prometheus/prometheus.yml.
        - name: config
          configMap:
            name: prometheus-config
        - name: data
          emptyDir: {}
