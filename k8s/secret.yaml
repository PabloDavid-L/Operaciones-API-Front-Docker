# SOLO DESARROLLO LOCAL.
# Estos valores son los mismos que .env.example. Para un cluster real,
# crear este Secret con valores propios (kubectl create secret) y no commitearlo.
apiVersion: v1
kind: Secret
metadata:
  name: cafe-secrets
  namespace: cafe
  labels:
    app.kubernetes.io/part-of: cafe
type: Opaque
stringData:
  DB_PASSWORD: postgres
  GRAFANA_PASSWORD: admin
