apiVersion: v1
kind: ConfigMap
metadata:
  name: api-config
  namespace: cafe
  labels:
    app.kubernetes.io/part-of: cafe
data:
  # DB_HOST apunta al Service de Postgres dentro del namespace.
  DB_HOST: postgres
  DB_PORT: "5432"
  DB_USER: postgres
  DB_NAME: cafedb
  # Mismos flags que en Docker local:
  # sin SSL y con creación automática de tablas.
  DB_SSL: "false"
  DB_SYNCHRONIZE: "true"
