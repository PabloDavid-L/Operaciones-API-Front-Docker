apiVersion: v1
kind: Service
metadata:
  name: grafana
  namespace: cafe
  labels:
    app: grafana
    app.kubernetes.io/part-of: cafe
spec:
  selector:
    app: grafana
  ports:
    - name: http
      port: 3000
      targetPort: 3000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  namespace: cafe
  labels:
    app: grafana
    app.kubernetes.io/part-of: cafe
spec:
  replicas: 1
  selector:
    matchLabels:
      app: grafana
  template:
    metadata:
      labels:
        app: grafana
    spec:
      containers:
        - name: grafana
          image: grafana/grafana:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
          env:
            - name: GF_SECURITY_ADMIN_USER
              value: admin
            - name: GF_SECURITY_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: cafe-secrets
                  key: GRAFANA_PASSWORD
            - name: GF_USERS_DEFAULT_THEME
              value: dark
            - name: GF_USERS_ALLOW_SIGN_UP
              value: "false"
            # Para que los links y redirects usen el host del Ingress.
            - name: GF_SERVER_ROOT_URL
              value: http://grafana.cafe.local
            - name: GF_SERVER_DOMAIN
              value: grafana.cafe.local
            # Menos trabajo en background (la imagen instala plugins al arrancar).
            - name: GF_ANALYTICS_CHECK_FOR_UPDATES
              value: "false"
            - name: GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES
              value: "false"
          volumeMounts:
            - name: datasource
              mountPath: /etc/grafana/provisioning/datasources/prometheus.yml
              subPath: prometheus.yml
              readOnly: true
            - name: dashboards-provider
              mountPath: /etc/grafana/provisioning/dashboards/dashboards.yml
              subPath: dashboards.yml
              readOnly: true
            - name: dashboard-cafe
              mountPath: /var/lib/grafana/dashboards
              readOnly: true
          readinessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 1Gi
      volumes:
        # Los tres se generan con kustomize desde los archivos de grafana/.
        - name: datasource
          configMap:
            name: grafana-datasource
        - name: dashboards-provider
          configMap:
            name: grafana-dashboards-provider
        - name: dashboard-cafe
          configMap:
            name: grafana-dashboard-cafe
