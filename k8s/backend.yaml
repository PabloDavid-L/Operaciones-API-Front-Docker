apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: cafe
  labels:
    app: api
    app.kubernetes.io/part-of: cafe
spec:
  selector:
    app: api
  ports:
    - name: http
      port: 3000
      targetPort: 3000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: cafe
  labels:
    app: api
    app.kubernetes.io/part-of: cafe
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      # En k8s no existe depends_on: esperamos a que Postgres acepte conexiones.
      initContainers:
        - name: wait-for-postgres
          image: postgres:16
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - until pg_isready -h postgres -p 5432 -U "$DB_USER"; do echo "esperando postgres..."; sleep 2; done
          env:
            - name: DB_USER
              valueFrom:
                configMapKeyRef:
                  name: api-config
                  key: DB_USER
      containers:
        - name: api
          # Imagen construida localmente; se carga con `minikube image load`.
          image: operaciones-copia-api:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
          envFrom:
            - configMapRef:
                name: api-config
          env:
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: cafe-secrets
                  key: DB_PASSWORD
          # Readiness consulta la BD; liveness solo verifica el proceso.
          readinessProbe:
            httpGet:
              path: /tipos
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 15
          livenessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
